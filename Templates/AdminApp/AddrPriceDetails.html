<!DOCTYPE html>
{%load static%}
<html lang="en">
<head>
<title>Green | basket</title>
<meta charset="utf-8">
<link rel="stylesheet" href="{%static 'css/style.css'%}">
<script src="{%static 'js/jquery-1.7.1.min.js'%}"></script>
<script src="{%static 'js/superfish.js'%}"></script>
<script src="{%static 'js/jquery.easing.1.3.js'%}"></script>
<script src="{%static 'js/tms-0.4.1.js'%}"></script>
<script src="{%static 'js/slider.js'%}"></script>
<!--[if lt IE 9]>
<script src="js/html5.js"></script>
<link rel="stylesheet" href="{%static 'css/ie.css'%}">
<link rel="stylesheet" href="{%static 'css/tablestyle.css'%}">
<![endif]-->
</head>
<body>
<div class="main-bg">
  <!-- Header -->
  <header>
    <div class="inner">
     <h1><a href="/">Green Basket</a></h1>
      <nav>
        <ul class="sf-menu">
          <li class="current"><a href="/adminapp/Home">home</a></li>
          <li><a href="/adminapp/pricedetails">Add Product Price Details</a></li>
            <li><a href="/adminapp/Viewpricedetails">View Product Price Details</a></li>

           <li><a href="/adminapp/login">Logout</a></li>
        </ul>
      </nav>
      <div class="clear"></div>
    </div>
  </header>
  <!-- Content -->
  <section id="content">
    <div class="container_24">
      <div class="wrapper">
        <div class="grid_24 content-bg">
          <div class="wrapper"  style="height:500px;background:lightgreen;">

          <center>
             <h2>Add Product Price Details</h2>

            <font color="red">{{msg}}</font>

            <form action="/adminapp/priceAction/" method="post">
                  {%csrf_token%}
                <table>
                  <tr><th>Product Name</th><td><input type="text" name="pname" required></td></tr>


                  <tr><th>Market Price/Kg</th><td><input type="number" name="mprice" required></td></tr>
                  <tr><th>Dealer Purchase Price/Kg</th><td><input type="number" name="dpprice" placeholder="not more than Market value" required></td></tr>
                  <tr><th>Dealer Sale Price/Kg</th><td><input type="number" name="dsprice" required></td></tr>


                  <tr><th></th><td><input type="submit"   value="Add Price" required>
                  <input type="reset" value="Reset" required></td></tr>

                </table>
                  </form>
          </center>





          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- Footer -->

</div>
</body>
</html>
